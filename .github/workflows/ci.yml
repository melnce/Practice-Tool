name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Best-effort off-peak UTC; GitHub may delay execution.
    - cron: "0 4 * * *"
  workflow_dispatch:

# PR runs share a group per PR number so superseded pushes cancel in-flight work.
# Push-to-main uses github.run_id so each merge commit keeps its own run (no cross-cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - name: Checkout (PR diff only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect engine-impacting paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
          else
            git fetch origin "${{ github.base_ref }}"
            PATTERN='^(src/|cards/|decks/|scripts/|package-lock\.json)'
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE "$PATTERN"; then
              echo "engine=true" >> "$GITHUB_OUTPUT"
            else
              echo "engine=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-test-check:
    if: >-
      (github.event_name != 'schedule' || github.repository == 'melnce/Practice-Tool') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_MAX_WORKERS: "2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache lint and format
        uses: actions/cache@v4
        with:
          path: .cache/
          key: lint-format-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            lint-format-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  soak:
    needs: changes
    if: >-
      (github.event_name != 'schedule' || github.repository == 'melnce/Practice-Tool') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Soak (seed 20260910)
        run: npx tsx scripts/soak.ts --games=400 --seed=20260910

      - name: Soak (seed 20260913)
        run: npx tsx scripts/soak.ts --games=400 --seed=20260913

      - name: Soak smoke (history round-trip)
        run: npm run soak:smoke

      - name: Upload soak reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-reports
          path: reports/soak/
          retention-days: 14

  e2e:
    needs: changes
    if: >-
      (github.event_name != 'schedule' || github.repository == 'melnce/Practice-Tool') &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: |
          START=$(date +%s)
          npx playwright test tests/e2e/interaction-sweep.spec.ts --project=e2e --workers=1 --reporter=line,github --trace=retain-on-failure
          END=$(date +%s)
          echo "E2E wall clock: $((END - START))s"

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
