<!doctype html>
<html lang="en">

<head>
  <script type="importmap">
      {
        "imports": {
          "main": "/dist/boot/boot.js",
          "gameLogic": "/dist/logic/index.js",

          "@core/": "/dist/core/",
          "@data/": "/dist/data/",
          "@logic/": "/dist/logic/",
          "@ui/": "/dist/ui/",
          "@helpers/": "/dist/helpers/",
          "@ops/": "/dist/logic/effects/ops/"

      }
    </script>

  <base href="/" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
  <title>Shadowverse Practice Tool</title>
  <script>
    window.APP_ROOT = "/";
  </script>

  <!-- existing styles (unchanged order) -->
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/buttons.css" />
  <link rel="stylesheet" href="./css/cards.css" />
  <link rel="stylesheet" href="./css/layout.css" />

  <!-- new modern theme overrides (must be last) -->
  <link rel="stylesheet" href="./css/modern-theme.css" />
  <style>
    /* Lightweight drawer + hamburger (no extra CSS files needed) */
    .hamburger-btn {
      position: fixed;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 350;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, #1a1f27, #141821);
      color: #e9edf1;
      font-weight: 800;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    }

    .hamburger-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: #e9edf1;
      position: relative;
    }

    .hamburger-btn span::before,
    .hamburger-btn span::after {
      content: "";
      position: absolute;
      left: 0;
      width: 20px;
      height: 2px;
      background: #e9edf1;
    }

    .hamburger-btn span::before {
      top: -6px;
    }

    .hamburger-btn span::after {
      top: 6px;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 360px;
      z-index: 340;
      transform: translateX(-100%);
      transition: transform 0.18s ease;
      background: rgba(24, 26, 32, 0.92);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.45);
      padding: 14px 14px 18px 14px;
      overflow: auto;
    }

    .drawer.open {
      transform: none;
    }

    .drawer h3 {
      margin: 6px 0 4px;
    }

    .drawer hr {
      border-color: rgba(255, 255, 255, 0.08);
    }

    .drawer ul {
      margin: 6px 0 0 18px;
    }

    .drawer li {
      margin: 4px 0;
    }

    .drawer .title {
      font-weight: 900;
      letter-spacing: 0.3px;
      margin: 4px 0 8px;
    }

    .scrim {
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 330;
      display: none;
    }

    .scrim.show {
      display: block;
    }

    .hist-list {
      list-style: none;
      padding-left: 0;
      margin-left: 0;
    }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0;
    }

    .hist-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
      /* gives room for long names before ellipsis */
    }

    .cost-badge {
      display: inline-grid;
      place-items: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 12px;
      background: linear-gradient(180deg, #262c36, #1a1f27);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e9edf1;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
    }

    #historyImgPreview img {
      max-width: 198px;
      height: auto;
    }
  </style>
</head>

<body>

  <div id="targetingConfirmation" style="
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: none;

  <!-- sticky control bar -->

      <select id="blueDeckSelect">
        <option value="example_deck">example_deck</option>
      </select>

      <label for="redDeckSelect">Red Deck:</label>

        <option value="example_deck">example_deck</option>

  <!-- Hamburger to open history drawer -->

  </button>
  <div id="historyScrim" class="scrim"></div>

  <aside id="historyDrawer" class="drawer" aria-hidden="true">

    <!-- Red on top -->

    </section>
    <section>

  <main id="appRoot">

          <span>☠️ <span id="redShadows">0</span></span>
        </div>
        <div id="redCrests" class="crest-container">
          <div class="crest-row">
            <div class="crest-slot"></div>
            <div class="crest-slot"></div>
            <div class="crest-slot"></div>
          </div>
          <div class="crest-row">
            <div class="crest-slot"></div>
            <div class="crest-slot"></div>
          </div>
        </div>
      </div>

      <div class="leader-container">
        <button id="redNormalEvo" class="evo-btn normal-evo">Evo</button>
        <div class="leader red-leader" id="redLeader">

        </div>

    <!-- Blue side -->

      <div class="floating-stats" id="blueStatsContainer">
        <div id="blueCrests" class="crest-container">
          <div class="crest-row">
            <div class="crest-slot"></div>
            <div class="crest-slot"></div>
          </div>
          <div class="crest-row">
            <div class="crest-slot"></div>
            <div class="crest-slot"></div>
            <div class="crest-slot"></div>

        </div>
        <div id="blueStats">

          <span>📦 <span id="blueDeckCount">0</span></span>
          <span>💀 <span id="blueGraveCount">0</span></span>

  <!-- Turn controls (unchanged IDs/handlers) -->
  <aside id="turnControls">

  <script type="module" src="./dist/boot/boot.js"></script>
  <!-- Hotkeys only (Ctrl+Z / Ctrl+Y) + Drawer open/close -->
  <script type="module">
    // Note: Hotkeys (Ctrl+Z/Y) are registered in boot.ts - do not duplicate here

    const toggle = document.getElementById("historyToggle");
    const drawer = document.getElementById("historyDrawer");
    const scrim = document.getElementById("historyScrim");

    function openDrawer() {
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      scrim.classList.add("show");
    }
    function closeDrawer() {
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      scrim.classList.remove("show");
    }
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      if (drawer.classList.contains("open")) {
        closeDrawer();
      } else {
        openDrawer();
      }
    });
    scrim.addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDrawer();
    });
    // Prevent clicks inside the drawer from closing it via event bubbling
    drawer.addEventListener("click", (e) => e.stopPropagation());
    document.addEventListener("click", (e) => {
      // If click happens outside the drawer while it's open, close it
      if (
        drawer.classList.contains("open") &&
        !drawer.contains(e.target) &&
        e.target !== toggle
      ) {
        closeDrawer();
      }
    });
  </script>

  <script>
    window.resolvePath = (path) => {
      const script = document.currentScript.src;
      const base = script.substring(0, script.lastIndexOf("/"));
      console.log(`Resolving ${path} from ${base}`);
      return new URL(path, base + "/").href;
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</body>
